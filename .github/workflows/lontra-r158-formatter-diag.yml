name: TEMP R158 ruff diff
on:
  push:
    branches: [lontra/raw-readback-observation-433]
jobs:
  format-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Show exact formatter change (diagnostic only)
        working-directory: etl
        run: uvx --from ruff==0.15.12 ruff format --diff tests/test_raw_readback.py
