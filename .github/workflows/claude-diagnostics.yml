name: Claude — Phase 1 diagnostics

# Workflow harness for Claude to run diagnostic / debugging code with
# IA secret access. Posts only status, numeric exit code and run link
# to the target PR, never the diagnostic stdout/stderr transcript. The
# job still fails when the diagnostic fails.
#
# Currently runs Phase 1 step 1.2 (simples cardinality probe) +
# 1.1-lite (IA inventory check). See docs/perf-plan-2026-05.md.

on:
  # Auto-trigger on the audit/plan branch so updates to the script run
  # without needing manual workflow_dispatch from a Claude session that
  # doesn't have a dispatch tool surfaced. Other branches must use
  # workflow_dispatch explicitly.
  push:
    branches:
      - claude/ficha-performance-audit-U4YJn
      - claude/plan-next-steps-l7Dt6
    paths:
      - '.github/workflows/claude-diagnostics.yml'
      - 'etl/scripts/diagnostics/**'
  workflow_dispatch:
    inputs:
      script:
        description: 'Script under etl/scripts/diagnostics/ to run (without .py)'
        required: false
        type: string
        default: 'phase1'
      target_pr:
        description: 'PR number to comment on (default 31)'
        required: false
        type: string
        default: '31'
      month:
        description: 'Snapshot month YYYY-MM for diagnostics that need one'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        working-directory: etl
        run: uv python install 3.11

      - name: Install deps
        working-directory: etl
        run: uv sync --frozen

      - name: Resolve inputs (defaults when triggered by push)
        id: cfg
        env:
          REQUESTED_SCRIPT: ${{ inputs.script }}
          REQUESTED_TARGET_PR: ${{ inputs.target_pr }}
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          SCRIPT="$REQUESTED_SCRIPT"
          TARGET_PR="$REQUESTED_TARGET_PR"
          # Branch-aware defaults on push: this branch runs the IA
          # practicality probe and comments on its own PR (#41).
          # FORCE_FAIL was used while iterating to wake the subscribed
          # Claude session even on success; now that bootstrap has
          # actually published parquets, we want real green/red signal
          # so leave it at 0.
          FORCE_FAIL=0
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "claude/plan-next-steps-l7Dt6" ]; then
            # ia_practicality already passed green twice; switch the
            # default to the per-company doc-format POC so this push
            # exercises that. Override with workflow_dispatch.script if
            # you want to re-run the practicality probe.
            [ -z "$SCRIPT" ] && SCRIPT="zip_layout_poc"
            [ -z "$TARGET_PR" ] && TARGET_PR="41"
          fi
          [ -z "$SCRIPT" ] && SCRIPT="phase1"
          [ -z "$TARGET_PR" ] && TARGET_PR="31"
          MONTH="$REQUESTED_MONTH"
          # Never put workflow_dispatch strings directly into shell source or
          # multiline GITHUB_OUTPUT records. Reject path and output injection.
          if [[ ! "$SCRIPT" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,63}$ ]]; then
            echo "::error::invalid diagnostic script name"
            exit 2
          fi
          if [[ ! "$TARGET_PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::invalid target PR number"
            exit 2
          fi
          if [[ -n "$MONTH" && ! "$MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::invalid snapshot month"
            exit 2
          fi
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "target_pr=$TARGET_PR" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "force_fail=$FORCE_FAIL" >> "$GITHUB_OUTPUT"
          echo "Resolved: script=$SCRIPT target_pr=$TARGET_PR month='$MONTH' force_fail=$FORCE_FAIL"

      - name: Run diagnostic script
        id: run
        working-directory: etl
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          CNPJ_SHARE_TOKEN: ${{ secrets.CNPJ_SHARE_TOKEN }}
          MONTH: ${{ steps.cfg.outputs.month }}
          DIAGNOSTIC_SCRIPT: ${{ steps.cfg.outputs.script }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -o pipefail
          SCRIPT="scripts/diagnostics/${DIAGNOSTIC_SCRIPT}.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::diagnostic script not found"
            printf 'exit_code=2\n' >> "$GITHUB_OUTPUT"
            exit 2
          fi
          # GitHub invokes Bash with errexit; suspend it for this pipeline
          # so PIPESTATUS is available even when the diagnostic fails.
          set +e
          uv run python "$SCRIPT" 2>&1 | tee /tmp/diag.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          exit_code="${pipeline_status[0]}"
          # Failure of tee must not become a green diagnostic.
          if [ "${pipeline_status[1]}" -ne 0 ] && [ "$exit_code" -eq 0 ]; then
            exit_code="${pipeline_status[1]}"
          fi
          printf 'exit_code=%s\n' "$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"
        # Continue to a red/green status-only comment; the final step
        # propagates failure without publishing diagnostic output.
        continue-on-error: true

      - name: Build PR comment
        if: always() && steps.cfg.outcome == 'success' && (steps.run.outcome == 'success' || steps.run.outcome == 'failure')
        id: build
        env:
          DIAG_STATUS: ${{ steps.run.outcome }}
          DIAG_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          # Refuse missing/non-numeric output and unexpected metadata.
          if [[ ! "$DIAG_STATUS" =~ ^(success|failure)$ || ! "$DIAG_EXIT_CODE" =~ ^[0-9]{1,3}$ || ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ || ! "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::invalid diagnostic metadata"
            exit 2
          fi
          printf '## Diagnostic run\n\n**Status:** `%s`\n**Exit code:** `%s`\n**Run:** [`%s`](https://github.com/%s/actions/runs/%s)\n' \
            "$DIAG_STATUS" "$DIAG_EXIT_CODE" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/comment.md
      - name: Post comment on PR
        if: always() && steps.cfg.outcome == 'success' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cfg.outputs.target_pr }}
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Propagate script exit code
        if: always()
        run: |
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            echo "::error::diagnostic script failed; see run status and log"
            exit 1
          fi
          if [ "${{ steps.cfg.outputs.force_fail }}" = "1" ]; then
            echo "::notice::force_fail=1 — exiting non-zero to wake the subscribed Claude session"
            exit 1
          fi
