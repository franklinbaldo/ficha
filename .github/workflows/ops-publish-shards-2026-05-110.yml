name: Ops — direct durability probe for 2026-05 shard 98

# Workflow operacional temporário. Mede a pós-condição direta do ZIP no item
# real sem liberar a matriz 00..98. Não deve ser mergeado em main.
on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ficha-publish-shards-2026-05
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  direct-proof:
    if: github.event.pull_request.head.ref == 'ops/publish-shards-2026-05-110'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --extra dev
      - name: Probe direct ZIP + _meta + sidecar durability on shard 98
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: uv run python .ops_probe_direct_shard_98.py
      - name: Preserve direct durability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-shard-probe-98-2026-05
          path: etl/direct-shard-probe-98.json
          if-no-files-found: ignore
          retention-days: 14
