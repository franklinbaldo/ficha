name: Inspect encoding delta #116

on:
  push:
    branches:
      - ops/inspect-encoding-delta-116
    paths:
      - 'etl/.ops-inspect-encoding-delta-116'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.11
        working-directory: etl
      - run: uv sync --frozen
        working-directory: etl

      - name: Download selected 2026-05 estabelecimento ZIPs from Internet Archive
        run: |
          set -euxo pipefail
          mkdir -p /tmp/estab
          for i in 1 3 4 5 6 9; do
            curl -L --fail --retry 4 --retry-all-errors \
              -o "/tmp/estab/Estabelecimentos${i}.zip" \
              "https://archive.org/download/ficha-2026-05/raw/Estabelecimentos${i}.zip"
            mkdir -p "/tmp/estab/${i}"
            unzip -q "/tmp/estab/Estabelecimentos${i}.zip" -d "/tmp/estab/${i}"
            rm "/tmp/estab/Estabelecimentos${i}.zip"
          done
          du -sh /tmp/estab

      - name: Compare latin-1 vs utf-8+ignore_errors
        working-directory: etl
        run: |
          uv run python - <<'PY'
          import json
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          import duckdb
          from ficha_etl import registry

          root = Path('/tmp/estab')
          spec = registry.main_table('estabelecimento').source
          key = ('cnpj_basico', 'cnpj_ordem', 'cnpj_dv')
          text_fields = [
              'nome_fantasia', 'tipo_logradouro', 'logradouro', 'complemento',
              'bairro', 'correio_eletronico', 'nome_cidade_exterior',
              'situacao_especial',
          ]

          def select_sql(path: Path, encoding: str, ignore_errors: bool) -> str:
              return registry.read_csv_select_sql(
                  spec, [path], encoding=encoding, ignore_errors=ignore_errors
              )

          def char_class(s: str | None) -> dict[str, int]:
              if not s:
                  return {'non_ascii': 0, 'controls': 0, 'replacement': 0}
              return {
                  'non_ascii': sum(ord(ch) > 127 for ch in s),
                  'controls': sum(ord(ch) < 32 and ch not in '\t\r\n' for ch in s),
                  'replacement': s.count('\ufffd'),
              }

          con = duckdb.connect()
          con.execute("PRAGMA threads=1")
          results = []
          global_field_hits = Counter()
          global_char_hits = Counter()
          sample_rows = []

          for idx in (1, 3, 4, 5, 6, 9):
              files = [p for p in (root / str(idx)).iterdir() if p.is_file()]
              if len(files) != 1:
                  raise RuntimeError(f'chunk {idx}: expected one CSV, got {files}')
              path = files[0]
              print(f'=== chunk {idx}: {path.name} ===', flush=True)

              con.execute(f"CREATE OR REPLACE TABLE latin AS {select_sql(path, 'latin-1', False)}")
              con.execute(f"CREATE OR REPLACE TABLE utf8 AS {select_sql(path, 'utf-8', True)}")
              latin_n = con.execute('SELECT COUNT(*) FROM latin').fetchone()[0]
              utf8_n = con.execute('SELECT COUNT(*) FROM utf8').fetchone()[0]

              join_cond = ' AND '.join(f'l.{c} IS NOT DISTINCT FROM u.{c}' for c in key)
              missing_where = ' AND '.join(f'u.{c} IS NULL' for c in key)
              con.execute(f"""
                  CREATE OR REPLACE TEMP TABLE lost AS
                  SELECT l.* FROM latin l
                  LEFT JOIN utf8 u ON {join_cond}
                  WHERE {missing_where}
              """)
              lost_n = con.execute('SELECT COUNT(*) FROM lost').fetchone()[0]

              # Distinguish true missing keys from possible duplicate-key artifacts.
              latin_dupes = con.execute(
                  "SELECT COUNT(*) - COUNT(DISTINCT cnpj_basico || '|' || cnpj_ordem || '|' || cnpj_dv) FROM latin"
              ).fetchone()[0]

              field_hits = {}
              for field in text_fields:
                  n = con.execute(
                      f"SELECT COUNT(*) FROM lost WHERE {field} IS NOT NULL AND {field} <> ''"
                  ).fetchone()[0]
                  field_hits[field] = n
                  global_field_hits[field] += n

              # Small, redacted sample: only key + field lengths/character classes.
              rows = con.execute(
                  "SELECT " + ', '.join(key + tuple(text_fields)) + " FROM lost USING SAMPLE reservoir(25 ROWS) REPEATABLE(42)"
              ).fetchall()
              chunk_char = Counter()
              for row in rows:
                  rec = {'chunk': idx, 'cnpj_prefix': (row[0] or '')[:4]}
                  for off, field in enumerate(text_fields, start=len(key)):
                      value = row[off]
                      cls = char_class(value)
                      rec[field] = {'len': len(value) if value is not None else None, **cls}
                      for k, v in cls.items():
                          if v:
                              chunk_char[f'{field}:{k}'] += 1
                              global_char_hits[f'{field}:{k}'] += 1
                  sample_rows.append(rec)

              # Byte-oriented probe: count suspicious raw bytes in the whole CSV,
              # then compare with expected CP1252/latin-1 punctuation bytes.
              raw_counts = Counter()
              with open(path, 'rb') as fh:
                  while True:
                      block = fh.read(8 * 1024 * 1024)
                      if not block:
                          break
                      for b in block:
                          if b >= 0x80 or b < 0x20:
                              raw_counts[b] += 1
              top_high = [
                  {'byte': f'0x{b:02X}', 'count': n}
                  for b, n in raw_counts.most_common(20)
                  if b >= 0x80
              ][:12]
              controls = [
                  {'byte': f'0x{b:02X}', 'count': n}
                  for b, n in sorted(raw_counts.items())
                  if b < 0x20 and b not in (0x0A, 0x0D, 0x09)
              ]

              results.append({
                  'chunk': idx,
                  'latin_rows': latin_n,
                  'utf8_ignore_rows': utf8_n,
                  'delta': latin_n - utf8_n,
                  'lost_by_key': lost_n,
                  'latin_duplicate_keys': latin_dupes,
                  'field_nonempty_among_lost': field_hits,
                  'sample_character_flags': dict(chunk_char),
                  'top_non_ascii_raw_bytes': top_high,
                  'raw_control_bytes': controls[:20],
              })
              print(json.dumps(results[-1], ensure_ascii=False, indent=2), flush=True)
              con.execute('DROP TABLE IF EXISTS latin')
              con.execute('DROP TABLE IF EXISTS utf8')
              con.execute('DROP TABLE IF EXISTS lost')

          summary = {
              'chunks': results,
              'total_delta_selected_chunks': sum(r['delta'] for r in results),
              'total_lost_by_key_selected_chunks': sum(r['lost_by_key'] for r in results),
              'field_nonempty_totals_among_lost': dict(global_field_hits),
              'sample_character_flags_totals': dict(global_char_hits),
              'redacted_sample': sample_rows[:100],
          }
          Path('encoding-delta-116.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2)
          )
          print('=== SUMMARY ===')
          print(json.dumps({k: v for k, v in summary.items() if k != 'redacted_sample'}, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: encoding-delta-116
          path: etl/encoding-delta-116.json
          if-no-files-found: error
