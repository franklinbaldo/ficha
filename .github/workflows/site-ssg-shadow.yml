name: SSG shadow (no deploy)

on:
  pull_request:
    paths:
      - 'site-ssg/**'
      - '.github/workflows/site-ssg-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssg-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-shadow:
    name: SSG Rust source and output contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: site-ssg
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run SSG source contracts
        run: node --test tests/*.test.mjs

      - name: Install verified SSG Rust 0.0.75
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ssg-0.0.75.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/sebastienrousseau/static-site-generator/releases/download/v0.0.75/ssg-v0.0.75-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'f6305109e9bec5895e9c90f97a5c569c74048b3d50823d40175e15ca99c50843' "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" ssg
          chmod 755 "$RUNNER_TEMP/ssg"
          "$RUNNER_TEMP/ssg" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate and build static site
        run: |
          ssg check --config config.toml
          ssg build --config config.toml

      - name: Remove exact SSG PWA manifest from shadow output
        run: node scripts/remove-ssg-manifest.mjs

      - name: Verify actual output and CSS
        run: |
          node scripts/materialize-assets.mjs
          node scripts/check-built.mjs

      - name: Chromium on generated shadow (offline 404 and 500 only)
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install chromium --with-deps
          node tests/browser-shadow.mjs

      - name: Observe published Astro Pages in Chromium (read-only, one-byte Range)
        run: node tests/browser-public.mjs

      - name: Upload bounded public-browser evidence (never deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pages-browser-${{ github.run_id }}
          path: site-ssg/evidence-public/
          retention-days: 3
          if-no-files-found: ignore

      - name: Confirm no publishing happened
        run: |
          test -f dist/ficha/index.html
          test -f dist/ficha/sobre/index.html
          echo "Shadow only. No Pages deployment, ETL, IA, or manifest promotion."
