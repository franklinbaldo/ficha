name: Apply fix — encoding invariance #116 (PR)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'fix/encoding-invariance-116'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.11
        working-directory: etl
      - run: uv sync --frozen
        working-directory: etl

      - name: Apply deterministic patch
        run: python scripts/apply-encoding-invariance-116.py

      - name: Run focused regression tests
        working-directory: etl
        run: uv run pytest -q tests/test_encoding_invariance_116.py tests/test_transform.py

      - name: Run lint
        working-directory: etl
        run: |
          uv run ruff check src/ficha_etl/transform.py tests/test_encoding_invariance_116.py
          uv run ruff format --check src/ficha_etl/transform.py tests/test_encoding_invariance_116.py

      - name: Commit fix to branch
        run: |
          git config user.name "ficha-etl-bot"
          git config user.email "ficha-etl-bot@users.noreply.github.com"
          git add etl/src/ficha_etl/transform.py etl/tests/test_encoding_invariance_116.py
          git commit -m "fix(etl): resolve CSV encoding per file (#116)"
          git push origin HEAD:${{ github.head_ref }}
