name: Probe — upload 32–440 MiB com aquecimento (#159)

# PR operacional: mede o intervalo que separa as geometrias candidatas de #147.
# Não toca ficha-YYYY-MM e não deve ser mergeado em main.

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ia-upload-sweep-159
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    if: github.event.pull_request.head.ref == 'ops/ia-upload-sweep-159'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --extra dev

      - name: Measure controlled upload sweep
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: uv run python .ops_probe_upload_sweep.py

      - name: Preserve measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-upload-sweep-159
          path: etl/upload-sweep-results.json
          if-no-files-found: ignore
          retention-days: 7
