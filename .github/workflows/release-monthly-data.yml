name: Release monthly data

on:
  workflow_run:
    workflows:
      - ETL — monthly snapshot
    types:
      - completed
  push:
    branches: [main]
    paths:
      - web/public/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Release current data month if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          month=$(jq -r '.current // empty' web/public/manifest.json)
          test -n "$month"
          tag="data-$month"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do"
            exit 0
          fi
          gh release create "$tag" --target "$(git rev-parse HEAD)" --title "Dados $month" --notes "Snapshot mensal $month publicado e verificado automaticamente pelo pipeline ETL."
