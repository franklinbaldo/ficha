name: Tartaruga Ruff format diagnostic
on:
  push:
    branches:
      - tartaruga/433-central-extra-tlv-fail-closed
  workflow_dispatch:
  pull_request:
jobs:
  show-ruff-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff format diff
        run: |
          cd etl
          uvx --from ruff==0.15.12 ruff format --diff src/ficha_etl/raw_preflight.py || true
