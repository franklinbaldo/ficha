name: Visual capture · SSG accessibility

on:
  pull_request:
    paths:
      - 'site/**'
      - 'web/public/manifest.json'
      - 'web/scripts/check-accessibility.mjs'
      - 'web/package.json'
      - 'web/bun.lock'
      - '.github/workflows/visual-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Conferir SHA do checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install browser audit dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun add --no-save playwright@1.54.2 axe-core@4.10.3
      - name: Install pinned SSG Rust and verify SHA-256
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ssg.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/sebastienrousseau/static-site-generator/releases/download/v0.0.75/ssg-v0.0.75-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'f6305109e9bec5895e9c90f97a5c569c74048b3d50823d40175e15ca99c50843' "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" ssg
          chmod 755 "$RUNNER_TEMP/ssg"
          "$RUNNER_TEMP/ssg" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build the published SSG artifact (not Astro)
        working-directory: site
        run: |
          ssg check --config config.toml
          ssg build --config config.toml
          node scripts/finalize.mjs
      # Both audits use the default Playwright headless shell (no browser channel).
      # The browser assertions themselves fail if the runner lacks required libraries.
      - name: Install Chromium headless shell
        working-directory: web
        run: bunx playwright install chromium --only-shell
      - name: Serve built Pages artifact locally
        run: |
          set -euo pipefail
          mkdir -p .capture-root/ficha
          cp -a site/dist/ficha/. .capture-root/ficha/
          python3 -m http.server 4321 --directory .capture-root > /tmp/ficha-capture-server.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4321/ficha/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ficha-capture-server.log
          exit 1
      - name: Audit actual SSG home with Chromium, axe and keyboard
        working-directory: web
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FICHA_SITE_MODE: ssg
        run: bun run scripts/check-accessibility.mjs http://127.0.0.1:4321/ficha/ ../accessibility-evidence
      - name: Exercise product pages in Chromium (manifest real, no Parquet fetch)
        working-directory: web
        run: node scripts/check-greenfield.mjs http://127.0.0.1:4321/ficha/ ../accessibility-evidence
      - name: Upload browser accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ficha-ssg-a11y-${{ github.event.pull_request.head.sha || github.sha }}
          path: accessibility-evidence/
          if-no-files-found: error
          retention-days: 30
