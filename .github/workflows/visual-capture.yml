name: Visual capture

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/visual-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun add --no-save playwright@1.54.2

      - name: Build site as GitHub Project Pages
        working-directory: web
        env:
          SITE: https://franklinbaldo.github.io
          BASE_PATH: /ficha/
        run: bun run build

      - name: Install Chromium for capture
        working-directory: web
        run: bunx playwright install chromium --with-deps

      - name: Prepare project-pages mount
        run: |
          mkdir -p .capture-root/ficha
          cp -a web/dist/. .capture-root/ficha/

      - name: Serve built artifact
        run: |
          python3 -m http.server 4321 --directory .capture-root > /tmp/ficha-capture-server.log 2>&1 &
          echo $! > /tmp/ficha-capture-server.pid
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4321/ficha/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ficha-capture-server.log
          exit 1

      - name: Capture first fold with hydration evidence
        working-directory: web
        run: |
          bun run scripts/capture-home.mjs \
            http://127.0.0.1:4321/ficha/ \
            ../visual-evidence

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: ficha-home-visual-${{ github.sha }}
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 30
