name: Ops — apply 2026-05 manifest candidate

on:
  push:
    branches: [data/promote-2026-05-dual]

permissions:
  actions: read
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/promote-2026-05-dual
          fetch-depth: 0

      - name: Download approved candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: manifest-candidate-2026-05-dual
          path: candidate
          github-token: ${{ github.token }}
          repository: franklinbaldo/ficha
          run-id: 31663577028

      - name: Validate and apply exact candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          candidate = Path('candidate/web/public/manifest.json')
          payload = json.loads(candidate.read_text())
          assert payload['current'] == '2026-05'
          assert [s['date'] for s in payload['snapshots']] == ['2026-05', '2026-04']
          entry = payload['snapshots'][0]
          assert len(entry['files']['companies']['shards']) == 100
          assert len(entry['lookups']) == 6
          assert all('/raw/companies-' not in s['url'] for s in entry['files']['companies']['shards'])
          Path('web/public/manifest.json').write_bytes(candidate.read_bytes())
          PY

      - name: Commit manifest and remove bootstrap workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/ops-apply-2026-05-candidate.yml
          git add web/public/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(manifest): promote 2026-05 dual-hash snapshot'
          git push origin HEAD:data/promote-2026-05-dual
