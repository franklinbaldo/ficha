name: _tmp O Vigia First Story canonical probe

on:
  push:
    branches:
      - ops/ovigia-first-story-probe
    paths:
      - .github/workflows/_tmp-ovigia-first-story-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check 'duckdb>=1.3,<2'

      - name: Execute canonical April to May probe
        id: probe
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import traceback
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          import duckdb

          MANIFEST = 'https://franklinbaldo.github.io/ficha/manifest.json'
          PREVIOUS = '2026-04'
          CURRENT = '2026-05'
          UF = 'RO'
          MUNICIPIO = '0003'
          OUT = Path('ovigia-first-story-probe.json')

          def checksum_ok(cnpj: str) -> bool:
              digits = ''.join(ch for ch in str(cnpj) if ch.isdigit())
              if len(digits) != 14:
                  return False
              def digit(base: str, weights: list[int]) -> str:
                  total = sum(int(a) * b for a, b in zip(base, weights, strict=True))
                  remainder = total % 11
                  return '0' if remainder < 2 else str(11 - remainder)
              d1 = digit(digits[:12], [5,4,3,2,9,8,7,6,5,4,3,2])
              d2 = digit(digits[:12] + d1, [6,5,4,3,2,9,8,7,6,5,4,3,2])
              return digits[-2:] == d1 + d2

          result = {
              'probe': 'ovigia-first-story-2026-04-to-2026-05',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'manifest_url': MANIFEST,
              'previous_competence': PREVIOUS,
              'current_competence': CURRENT,
              'uf': UF,
              'municipio_codigo': MUNICIPIO,
              'status': 'error',
          }
          exit_code = 1
          try:
              with urllib.request.urlopen(MANIFEST, timeout=30) as response:
                  manifest_bytes = response.read()
              manifest = json.loads(manifest_bytes.decode('utf-8'))
              result['manifest_sha256'] = hashlib.sha256(manifest_bytes).hexdigest()
              by_date = {str(s.get('date') or s.get('competence')): s for s in manifest['snapshots']}
              prev = by_date[PREVIOUS]['files']['cnpjs']
              curr = by_date[CURRENT]['files']['cnpjs']
              result['previous_source'] = {k: prev.get(k) for k in ('url','sha256','size')}
              result['current_source'] = {k: curr.get(k) for k in ('url','sha256','size')}

              con = duckdb.connect(database=':memory:')
              con.execute('INSTALL httpfs')
              con.execute('LOAD httpfs')
              prev_rows = con.execute(
                  """
                  SELECT CAST(cnpj AS VARCHAR)
                  FROM read_parquet(?)
                  WHERE upper(trim(CAST(uf AS VARCHAR))) = ?
                    AND lpad(trim(CAST(municipio_codigo AS VARCHAR)), 4, '0') = ?
                  """,
                  [prev['url'], UF, MUNICIPIO],
              ).fetchall()
              previous_cnpjs = {
                  ''.join(ch for ch in str(row[0] or '') if ch.isdigit())
                  for row in prev_rows
              }
              previous_cnpjs = {value for value in previous_cnpjs if len(value) == 14}

              columns = [
                  'cnpj','identificador_matriz_filial','razao_social','nome_fantasia',
                  'situacao_cadastral','data_inicio_atividade','cnae_principal_codigo',
                  'cnae_principal_descricao','bairro','uf','municipio_codigo',
              ]
              selected = ', '.join(f'"{c}"' for c in columns)
              current_rows = con.execute(
                  f"""
                  SELECT {selected}
                  FROM read_parquet(?)
                  WHERE upper(trim(CAST(uf AS VARCHAR))) = ?
                    AND lpad(trim(CAST(municipio_codigo AS VARCHAR)), 4, '0') = ?
                    AND lpad(trim(CAST(situacao_cadastral AS VARCHAR)), 2, '0') = '02'
                  """,
                  [curr['url'], UF, MUNICIPIO],
              ).fetchall()
              con.close()

              leads = []
              seen = set()
              for row in current_rows:
                  rec = dict(zip(columns, row, strict=True))
                  raw = ''.join(ch for ch in str(rec.get('cnpj') or '') if ch.isdigit())
                  if len(raw) != 14 or not checksum_ok(raw):
                      continue
                  if raw in previous_cnpjs or raw in seen:
                      continue
                  seen.add(raw)
                  leads.append({
                      'cnpj_raw': raw,
                      'razao_social': rec.get('razao_social'),
                      'nome_fantasia': rec.get('nome_fantasia'),
                      'data_inicio_atividade': str(rec.get('data_inicio_atividade') or '') or None,
                      'cnae_principal_codigo': str(rec.get('cnae_principal_codigo') or '') or None,
                      'cnae_principal_descricao': rec.get('cnae_principal_descricao'),
                      'bairro': rec.get('bairro'),
                      'identificador_matriz_filial': rec.get('identificador_matriz_filial'),
                  })
              leads.sort(key=lambda item: item['cnpj_raw'])
              result.update({
                  'status': 'ok',
                  'previous_porto_velho_count': len(previous_cnpjs),
                  'current_active_porto_velho_count': len(current_rows),
                  'lead_count': len(leads),
                  'leads': leads,
                  'detector_contract': 'ficha-new-active-establishment-v1-equivalent-probe',
                  'note': 'Independent deterministic probe mirroring O Vigia PureDetector; artifact is evidence, not canonical O Vigia state.',
              })
              exit_code = 0
          except Exception as exc:
              result['error_type'] = type(exc).__name__
              result['error'] = str(exc)
              result['traceback_tail'] = traceback.format_exc().splitlines()[-12:]
          finally:
              OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2, default=str) + '\n', encoding='utf-8')
              print(OUT.read_text(encoding='utf-8'))
          raise SystemExit(exit_code)
          PY
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload factual probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovigia-first-story-probe-${{ github.run_id }}
          path: ovigia-first-story-probe.json
          if-no-files-found: warn
          retention-days: 7
