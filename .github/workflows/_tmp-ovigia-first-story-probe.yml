name: _tmp O Vigia status transition probe

on:
  push:
    branches:
      - ops/ovigia-status-transition-probe
    paths:
      - .github/workflows/_tmp-ovigia-first-story-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check 'duckdb>=1.3,<2'

      - name: Measure canonical April to May status transitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import urllib.request
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          import duckdb

          MANIFEST = 'https://franklinbaldo.github.io/ficha/manifest.json'
          PREVIOUS = '2026-04'
          CURRENT = '2026-05'
          UF = 'RO'
          MUNICIPIO = '0003'
          OUT = Path('ovigia-status-transition-probe.json')

          with urllib.request.urlopen(MANIFEST, timeout=30) as response:
              manifest = json.loads(response.read().decode('utf-8'))
          by_date = {str(s.get('date') or s.get('competence')): s for s in manifest['snapshots']}
          prev = by_date[PREVIOUS]['files']['cnpjs']
          curr = by_date[CURRENT]['files']['cnpjs']

          con = duckdb.connect(database=':memory:')
          con.execute('INSTALL httpfs')
          con.execute('LOAD httpfs')
          rows = con.execute(
              """
              WITH a AS (
                SELECT
                  CAST(cnpj AS VARCHAR) AS cnpj,
                  lpad(trim(CAST(situacao_cadastral AS VARCHAR)), 2, '0') AS status_a,
                  CAST(data_situacao_cadastral AS VARCHAR) AS data_status_a
                FROM read_parquet(?)
                WHERE upper(trim(CAST(uf AS VARCHAR))) = ?
                  AND lpad(trim(CAST(municipio_codigo AS VARCHAR)), 4, '0') = ?
              ),
              m AS (
                SELECT
                  CAST(cnpj AS VARCHAR) AS cnpj,
                  lpad(trim(CAST(situacao_cadastral AS VARCHAR)), 2, '0') AS status_m,
                  CAST(data_situacao_cadastral AS VARCHAR) AS data_status_m
                FROM read_parquet(?)
                WHERE upper(trim(CAST(uf AS VARCHAR))) = ?
                  AND lpad(trim(CAST(municipio_codigo AS VARCHAR)), 4, '0') = ?
              )
              SELECT a.cnpj, a.status_a, m.status_m, m.data_status_m
              FROM a JOIN m USING (cnpj)
              WHERE a.status_a = '02'
              """,
              [prev['url'], UF, MUNICIPIO, curr['url'], UF, MUNICIPIO],
          ).fetchall()
          con.close()

          counts = Counter(r[2] for r in rows)
          transitions = {code: int(counts.get(code, 0)) for code in ('03', '04', '08')}
          target_rows = [r for r in rows if r[2] in transitions]
          date_counts = Counter(str(r[3] or '') for r in target_rows)

          result = {
              'probe': 'ovigia-status-transitions-2026-04-to-2026-05',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'population': 'same CNPJ in Porto Velho in both snapshots; April status 02 denominator',
              'previous_competence': PREVIOUS,
              'current_competence': CURRENT,
              'previous_source': {k: prev.get(k) for k in ('url', 'sha256', 'size')},
              'current_source': {k: curr.get(k) for k in ('url', 'sha256', 'size')},
              'comparable_april_active_count': len(rows),
              'transition_counts': transitions,
              'target_transition_total': len(target_rows),
              'data_situacao_cadastral_counts': dict(sorted(date_counts.items())),
              'semantic_limits': [
                  'situacao cadastral does not by itself prove physical closure, bankruptcy, insolvency, layoffs, or economic distress',
                  'CNPJs absent from either snapshot and municipality changes are excluded from this denominator',
              ],
          }
          OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2, default=str) + '\n', encoding='utf-8')
          print(OUT.read_text(encoding='utf-8'))
          PY

      - name: Upload factual probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ovigia-status-transition-probe-${{ github.run_id }}
          path: ovigia-status-transition-probe.json
          if-no-files-found: error
          retention-days: 7
