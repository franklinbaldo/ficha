name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/public/manifest.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'web/public/manifest.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Conferir SHA do checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar finalizador SSG com entradas adversariais
        run: node --test site/scripts/finalize.test.mjs
      - name: Instalar SSG Rust fixado e conferir SHA-256
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ssg.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/sebastienrousseau/static-site-generator/releases/download/v0.0.75/ssg-v0.0.75-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'f6305109e9bec5895e9c90f97a5c569c74048b3d50823d40175e15ca99c50843' "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" ssg
          chmod 755 "$RUNNER_TEMP/ssg"
          "$RUNNER_TEMP/ssg" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build SSG Rust e conferir manifesto da Receita
        working-directory: site
        run: |
          ssg check --config config.toml
          ssg build --config config.toml
          node scripts/finalize.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist/ficha

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: HTTP smoke do Pages e identidade do manifesto RFB
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          curl -fsSL --retry 3 "$BASE/" -o index.html
          curl -fsSL --retry 3 "$BASE/sobre/" -o sobre.html
          curl -fsSL --retry 3 "$BASE/css/site.css" -o site.css
          curl -fsSL --retry 3 "$BASE/manifest.json" -o manifest-live.json
          grep -q 'Pesquisa por CNPJ ainda indisponível' index.html
          grep -q 'Sobre o FICHA' sobre.html
          grep -q 'focus-visible' site.css
          cmp web/public/manifest.json manifest-live.json
          node -e "const d=require('./manifest-live.json');if(!d.current||!d.snapshots?.some(s=>s.date===d.current))process.exit(1); console.log('Pages MVP + manifest OK: '+d.current)"
