name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test deployed site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          BASE="${PAGE_URL%/}"
          echo "Verifying $BASE"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$BASE/")
          [ "$code" = "200" ] || { echo "::error::homepage → HTTP $code"; exit 1; }
          curl -sSfL "$BASE/manifest.json" -o manifest.json \
            || { echo "::error::manifest.json não publicado em $BASE/manifest.json"; exit 1; }
          CURRENT=$(jq -r '.current // ""' manifest.json)
          [ -n "$CURRENT" ] || { echo "::error::manifest.json sem campo 'current'"; exit 1; }
          echo "manifest OK — snapshot atual: $CURRENT"
          check_url() {
            local url="$1"
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' -I -L --max-time 60 "$url")
            [ "$code" = "200" ]
          }
          ESSENTIAL=$(jq -r --arg m "$CURRENT" '.snapshots[] | select(.date == $m) | [.files.cnpjs.url, (.lookups[]?.url)] | .[]' manifest.json)
          [ -n "$ESSENTIAL" ] || { echo "::error::nenhuma URL essencial encontrada pro mês $CURRENT"; exit 1; }
          fail=0
          while IFS= read -r url; do
            if check_url "$url"; then echo "OK   $url"; else echo "::error::$url → indisponível (essencial)"; fail=1; fi
          done <<< "$ESSENTIAL"
          [ "$fail" = "0" ] || exit 1
          COMPLEMENTARY=$(jq -r --arg m "$CURRENT" '.snapshots[] | select(.date == $m) | [(.files.socios.url // empty),(.files.cnpj_contatos.url // empty),(.files.cnpj_cnaes.url // empty),(.files.enderecos.url // empty),(.files.pessoas.url // empty)] | .[]' manifest.json)
          degraded=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            if check_url "$url"; then echo "OK   $url"; else echo "::warning::$url → indisponível (complementar — seção correspondente fica degradada no site)"; degraded=1; fi
          done <<< "$COMPLEMENTARY"
          if [ "$degraded" = "1" ]; then echo "site publicado com busca principal OK, mas com dataset(s) complementar(es) indisponível(is)"; else echo "snapshot files OK — todos os arquivos alcançáveis"; fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install browser audit dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun add --no-save playwright@1.54.2 axe-core@4.10.3
          bunx playwright install chromium --with-deps
      - name: Verify accessibility on the page readers receive
        working-directory: web
        env:
          GITHUB_HEAD_SHA: ${{ github.sha }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          BASE="${PAGE_URL%/}/"
          bun run scripts/check-accessibility.mjs "$BASE" ../public-accessibility-evidence
      - name: Upload public accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ficha-public-accessibility-${{ github.sha }}
          path: public-accessibility-evidence/
          if-no-files-found: error
          retention-days: 30
