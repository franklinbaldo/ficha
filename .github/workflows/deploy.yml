name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/public/manifest.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'web/public/manifest.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Conferir SHA do checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Instalar decoder canônico via lockfile congelado
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Testar finalizador e regras SSG com entradas adversariais
        run: |
          node --test site/scripts/finalize.test.mjs
          node --test site/tests/*.test.mjs
      - name: Instalar SSG Rust fixado e conferir SHA-256
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ssg.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/sebastienrousseau/static-site-generator/releases/download/v0.0.75/ssg-v0.0.75-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'f6305109e9bec5895e9c90f97a5c569c74048b3d50823d40175e15ca99c50843' "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" ssg
          chmod 755 "$RUNNER_TEMP/ssg"
          "$RUNNER_TEMP/ssg" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build SSG Rust e conferir manifesto da Receita
        working-directory: site
        run: |
          ssg check --config config.toml
          ssg build --config config.toml
          node scripts/finalize.mjs
          node scripts/bundle-protobuf.mjs
          node scripts/check-protobuf-bundle.mjs
          # Published unbundled JavaScript modules must survive SSG byte-for-byte.
          for module in boot search-app duckdb-runtime query-core dataset catalog record pages atomic-record atomic-browser; do
            cmp "static/js/$module.mjs" "dist/ficha/js/$module.mjs"
          done
          cmp static/css/site.css dist/ficha/css/site.css
          # A newly declared page must also load its ES module in the built output.
          for page in empresa historia explorar acervo; do
            test -f "dist/ficha/$page/index.html"
            grep -q '/ficha/js/pages.mjs' "dist/ficha/$page/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist/ficha

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Conferir SHA do checkout de verificação
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: HTTP smoke do Pages e identidade do manifesto RFB
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          curl -fsSL --retry 3 "$BASE/" -o index.html
          curl -fsSL --retry 3 "$BASE/sobre/" -o sobre.html
          curl -fsSL --retry 3 "$BASE/empresa/" -o empresa.html
          curl -fsSL --retry 3 "$BASE/historia/" -o historia.html
          curl -fsSL --retry 3 "$BASE/explorar/" -o explorar.html
          curl -fsSL --retry 3 "$BASE/acervo/" -o acervo.html
          curl -fsSL --retry 3 "$BASE/js/pages.mjs" -o pages.mjs
          curl -fsSL --retry 3 "$BASE/js/atomic-record.mjs" -o atomic-record.mjs
          curl -fsSL --retry 3 "$BASE/js/atomic-browser.mjs" -o atomic-browser.mjs
          curl -fsSL --retry 3 "$BASE/js/company-decoder.mjs" -o company-decoder.mjs
          curl -fsSL --retry 3 "$BASE/js/catalog.mjs" -o catalog.mjs
          curl -fsSL --retry 3 "$BASE/js/record.mjs" -o record.mjs
          curl -fsSL --retry 3 "$BASE/css/site.css" -o site.css
          curl -fsSL --retry 3 "$BASE/js/boot.mjs" -o boot.mjs
          curl -fsSL --retry 3 "$BASE/js/search-app.mjs" -o search-app.mjs
          curl -fsSL --retry 3 "$BASE/js/duckdb-runtime.mjs" -o duckdb-runtime.mjs
          curl -fsSL --retry 3 "$BASE/js/query-core.mjs" -o query-core.mjs
          curl -fsSL --retry 3 "$BASE/js/dataset.mjs" -o dataset-live.mjs
          curl -fsSL --retry 3 "$BASE/manifest.json" -o manifest-live.json
          grep -q 'id="busca-form"' index.html
          grep -q 'id="empresa-form"' empresa.html
          grep -q 'id="historia-form"' historia.html
          grep -q 'id="explorar-grafico"' explorar.html
          grep -q 'id="acervo-competencia"' acervo.html
          grep -q 'mountCompany' pages.mjs
          grep -q 'snapshotsDescending' catalog.mjs
          grep -q 'fetchRecordAt' record.mjs
          grep -q 'Sobre o FICHA' sobre.html
          grep -q 'focus-visible' site.css
          grep -q 'mountSearch' boot.mjs
          # grep proves only presence; byte equality rules out a stale public module.
          cmp site/static/js/boot.mjs boot.mjs
          cmp site/static/js/search-app.mjs search-app.mjs
          cmp site/static/js/duckdb-runtime.mjs duckdb-runtime.mjs
          cmp site/static/js/query-core.mjs query-core.mjs
          cmp site/static/js/dataset.mjs dataset-live.mjs
          cmp site/static/js/catalog.mjs catalog.mjs
          cmp site/static/js/record.mjs record.mjs
          cmp site/static/js/pages.mjs pages.mjs
          cmp site/static/js/atomic-record.mjs atomic-record.mjs
          cmp site/static/js/atomic-browser.mjs atomic-browser.mjs
          test "$(wc -c < company-decoder.mjs)" -gt 1000
          cmp site/static/css/site.css site.css
          cmp web/public/manifest.json manifest-live.json
          node -e "const d=require('./manifest-live.json');if(!d.current||!d.snapshots?.some(s=>s.date===d.current))process.exit(1); console.log('Pages MVP + manifest OK: '+d.current)"
