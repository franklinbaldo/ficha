name: ETL — issue 110 final backfill 2026-05

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: issue-110-final-backfill-2026-05
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  backfill:
    if: github.event.pull_request.head.ref == 'ops/backfill-2026-05-final-110'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/backfill-2026-05-final-110

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --extra dev

      - name: Apply and validate issue 118 raizes patch in checkout
        run: |
          uv run python .ops_apply_raizes_118.py
          uv run ruff format src/ficha_etl/transform.py
          uv run ruff check src tests
          uv run pytest tests -q
          uv run ruff format --check src tests

      - name: Materialize validated issue 118 transform on durable PR branch
        run: |
          set -euo pipefail
          cp src/ficha_etl/transform.py /tmp/transform-118.py
          cd ..
          git fetch origin fix/refresh-temp-cap-118
          git worktree add /tmp/pr118 origin/fix/refresh-temp-cap-118
          cp /tmp/transform-118.py /tmp/pr118/etl/src/ficha_etl/transform.py
          cd /tmp/pr118
          git config user.name ficha-etl-bot
          git config user.email ficha-etl-bot@users.noreply.github.com
          git add etl/src/ficha_etl/transform.py
          if git diff --cached --quiet; then
            echo 'validated transform already materialized on #126 branch'
          else
            git commit -m 'fix(etl): bucket raizes final join to bound spill (#118)'
            git push origin HEAD:fix/refresh-temp-cap-118
          fi

      - name: Run real publishing pipeline for 2026-05
        id: run
        continue-on-error: true
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          CNPJ_SHARE_TOKEN: ${{ secrets.CNPJ_SHARE_TOKEN }}
          FICHA_DROP_ZIPS_AFTER_LOAD: '1'
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -o pipefail
          uv run ficha-etl run --month 2026-05 2>&1 | tee run.log

      - name: Upload transform metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-transform-metrics-2026-05
          path: etl/.cache/2026-05/metrics/transform_metrics.json
          if-no-files-found: warn

      - name: Upload manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-manifest-2026-05
          path: web/public/manifest.json
          if-no-files-found: warn

      - name: Commit verified manifest to operational branch
        if: steps.run.outcome == 'success'
        run: |
          cd ..
          git add web/public/manifest.json
          if git diff --cached --quiet -- web/public/manifest.json; then
            echo '::error::pipeline succeeded but manifest did not change'
            exit 1
          fi
          git config user.name ficha-etl-bot
          git config user.email ficha-etl-bot@users.noreply.github.com
          git commit -m 'chore(etl): publish verified snapshot 2026-05 (#110)'
          git push origin HEAD:ops/backfill-2026-05-final-110

      - name: Capture log tail
        if: always()
        id: tail
        run: |
          {
            echo 'log<<TAIL_EOF'
            tail -c 20000 run.log 2>/dev/null || echo '(no run.log produced)'
            echo TAIL_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.run.outcome }}
          LOG: ${{ steps.tail.outputs.log }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const body = [
              '## ETL #110 — final real backfill `2026-05`',
              '',
              `**Pipeline:** \`${process.env.OUTCOME}\` · [workflow run](${process.env.RUN_URL})`,
              '',
              `<details${process.env.OUTCOME === 'success' ? '' : ' open'}><summary>Pipeline log tail</summary>`,
              '', '```', process.env.LOG || '(empty)', '```', '', '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Propagate pipeline failure
        if: steps.run.outcome != 'success'
        run: exit 1
