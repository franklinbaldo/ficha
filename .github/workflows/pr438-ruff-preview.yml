name: PR438 Ruff formatter preview (temporary)
on:
  push:
    branches: [feat/ficha433-raw-global-preflight]
    paths:
      - etl/src/ficha_etl/raw_preflight.py
      - etl/tests/test_raw_global_preflight.py
      - .github/workflows/pr438-ruff-preview.yml
jobs:
  formatter-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Display formatter diff (read-only)
        shell: bash
        run: uvx --from ruff==0.15.12 ruff format --diff etl/src/ficha_etl/raw_preflight.py etl/tests/test_raw_global_preflight.py || true
