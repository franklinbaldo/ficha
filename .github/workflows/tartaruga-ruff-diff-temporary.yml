name: Tartaruga temporary Ruff diff
on:
  push:
    branches:
      - coruja/zip64-local-extra-bit3-regression
permissions:
  contents: read
jobs:
  ruff-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Show format patch without modifying source
        run: uvx --from ruff==0.15.12 ruff format --diff etl/tests/test_tartaruga_bit3_no_zip64_extra.py
