name: Tartaruga Ruff diagnostics (temporary)
on:
  push:
    branches: [tartaruga/433-central-extra-tlv-fail-closed]
jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Print Ruff format diff
        working-directory: etl
        run: uvx --from ruff==0.15.12 ruff format --diff tests/test_tartaruga_central_extra_contract.py
