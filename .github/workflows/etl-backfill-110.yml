name: ETL — issue 110 backfill 2026-05

on:
  push:
    branches:
      - ops/backfill-2026-05-110
    paths:
      - '.github/workflows/etl-backfill-110.yml'
      - 'etl/.ops-backfill-110'
  pull_request:
    types: [reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  backfill:
    if: github.event_name == 'push' || github.event.pull_request.number == 112
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.11
      - run: uv sync --frozen

      - name: Run real pipeline for 2026-05
        id: run
        continue-on-error: true
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          CNPJ_SHARE_TOKEN: ${{ secrets.CNPJ_SHARE_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -o pipefail
          uv run ficha-etl run --month 2026-05 2>&1 | tee run.log

      - name: Upload transform metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transform-metrics-2026-05
          path: etl/.cache/2026-05/metrics/transform_metrics.json
          if-no-files-found: warn

      - name: Upload generated manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-2026-05
          path: web/public/manifest.json
          if-no-files-found: warn

      - name: Commit verified manifest to PR branch
        if: steps.run.outcome == 'success'
        run: |
          cd ..
          git add web/public/manifest.json
          if git diff --cached --quiet -- web/public/manifest.json; then
            echo "Manifest unchanged — treating as failure for this backfill"
            exit 1
          fi
          git config user.name "ficha-etl-bot"
          git config user.email "ficha-etl-bot@users.noreply.github.com"
          git commit -m "chore(etl): publish verified snapshot 2026-05 (#110)"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Capture log tail
        if: always()
        id: tail
        run: |
          {
            echo 'log<<TAIL_EOF'
            tail -c 16000 run.log 2>/dev/null || echo '(no run.log produced)'
            echo TAIL_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment result on PR
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.run.outcome }}
          LOG: ${{ steps.tail.outputs.log }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const branch = process.env.TARGET_BRANCH;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (!prs.length) return;
            const body = [
              `## ETL #110 — real backfill \`2026-05\``,
              ``,
              `**Pipeline:** \`${process.env.OUTCOME}\` · [workflow run](${process.env.RUN_URL})`,
              ``,
              `<details${process.env.OUTCOME === 'success' ? '' : ' open'}><summary>Pipeline log tail</summary>`,
              ``,
              '```',
              process.env.LOG || '(empty)',
              '```',
              ``,
              `</details>`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prs[0].number,
              body,
            });

      - name: Propagate pipeline failure
        if: steps.run.outcome != 'success'
        run: exit 1
