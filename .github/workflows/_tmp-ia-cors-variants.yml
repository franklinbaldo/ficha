name: _tmp IA CORS variants
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-ia-cors-variants.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe variants
        run: |
          for url in \
            'https://archive.org/download/ficha-2026-05/cnpjs.parquet' \
            'https://archive.org/serve/ficha-2026-05/cnpjs.parquet' \
            'https://archive.org/download/ficha-2026-05/cnpjs.parquet?download=1' \
            'https://archive.org/download/ficha-2026-05/cnpjs.parquet?cnt=0'
          do
            echo "=== $url ==="
            curl -sSIL --max-time 60 -H "Origin: https://franklinbaldo.github.io" "$url" | grep -Ei '^(HTTP/|location:|access-control-|accept-ranges:|content-length:)' || true
          done
