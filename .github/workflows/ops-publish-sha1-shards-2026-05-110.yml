          - '87'
          - '88'
          - '89'
          - '90'
          - '91'
          - '92'
          - '93'
          - '94'
          - '95'
          - '96'
          - '97'
          - '98'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --extra dev
      - name: Submit companies-${{ matrix.prefix }}.zip once
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: uv run python .ops_publish_sha1_shards_2026_05.py --submit '${{ matrix.prefix }}'
      - name: Preserve SUBMIT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-submit-${{ matrix.prefix }}-2026-05
          path: etl/shard-transfer-summary.json
          if-no-files-found: ignore
          retention-days: 14

  verify:
    needs: [resume-proof, submit]
    # VERIFY é read-only e deve colher todos os checkpoints mesmo quando um
    # SUBMIT isolado falha por timeout de preflight.
    if: ${{ always() && needs.resume-proof.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        prefix:
