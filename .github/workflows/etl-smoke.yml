name: ETL — upstream + mirror smoke check

on:
  pull_request:
    paths:
      - 'etl/**'
      - '.github/workflows/etl-smoke.yml'
  schedule:
    # Toda segunda 06:00 UTC. Detecta mudança de URL/disponibilidade da RFB
    # antes do cron mensal de fato rodar.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.11

      - run: uv sync

      # Diagnóstico independente do freshness: qual o mês mais recente que a
      # RFB expõe upstream. Roda sempre e reporta — é o que responde "a fábrica
      # quebrou ou é só atraso de publicação?". continue-on-error para não
      # abortar o smoke de conectividade se o list-snapshots em si falhar.
      - name: Upstream latest snapshot (list-snapshots)
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          {
            echo "## Upstream (RFB) — list-snapshots"
            echo ""
            echo '```'
            uv run ficha-etl list-snapshots 2>&1 | tee list-snapshots.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          LATEST=$(grep -Eo '[0-9]{4}-[0-9]{2}' list-snapshots.txt | sort | tail -n1 || true)
          echo "Latest upstream month: \`${LATEST:-<none>}\`" >> "$GITHUB_STEP_SUMMARY"

      # Fixture HTTP MockTransport tests: no RFB or Internet Archive access in PR.
      - name: PR smoke with fixtures
        if: github.event_name == 'pull_request'
        run: uv run --extra dev pytest -q tests/test_smoke.py tests/test_cli.py -k smoke

      - name: Run smoke check
        id: smoke
        if: always() && github.event_name != 'pull_request'
        run: |
          {
            echo "## ETL smoke check"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uv run ficha-etl smoke 2>&1 | tee smoke-output.txt | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          {
            echo '```'
            echo ""
            echo "Exit code: \`$rc\`"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'output<<SMOKE_EOF'
            cat smoke-output.txt
            echo 'SMOKE_EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Freshness roda por ÚLTIMO e com always(): o alarme de atraso do
      # snapshot não deve mais impedir os diagnósticos de conectividade acima.
      # Antes ele falhava PRIMEIRO e o smoke nunca rodava — exatamente no
      # estado quebrado (manifest 3+ meses atrás) que mais precisa saber se a
      # RFB/IA estão no ar ou se é só atraso de publicação.
      - name: Check manifest freshness
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          python3 - <<'EOF'
          import datetime, json, re, sys

          manifest = json.load(open("web/public/manifest.json"))
          current = manifest.get("current", "")
          if not current:
              print("::error::manifest.json sem campo 'current'")
              sys.exit(1)

          if not isinstance(current, str) or not re.fullmatch(r"[0-9]{4}-(0[1-9]|1[0-2])", current) or current.startswith("0000-"):
              print("::error::manifest.json com 'current' fora do formato YYYY-MM válido")
              sys.exit(1)

          year, month = map(int, current.split("-"))
          today = datetime.date.today()
          lag = (today.year - year) * 12 + (today.month - month)
          print(f"snapshot atual: {current} — {lag} mês(es) atrás de {today:%Y-%m}")

          # RFB publica o mês M durante o próprio M (às vezes M+1), e o cron
          # roda dia 5 — lag saudável é 0-1, e 2 é tolerável no começo do mês.
          if lag >= 3:
              print(f"::error::Snapshot {current} está {lag} meses atrasado — o alerta não distingue falha de suspensão deliberada. Verifique os runs e a política vigente (Ficha #433). Não execute o ETL manualmente sem autorização.")
              sys.exit(1)
          if lag == 2:
              print(f"::warning::Snapshot {current} está 2 meses atrás do calendário — verifique se o próximo cron mensal roda com sucesso.")
          EOF
