name: Apply #116 lossless encoding fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-test:
    if: github.event.pull_request.number == 117
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.11
        working-directory: etl
      - run: uv sync --extra dev
        working-directory: etl

      - name: Apply deterministic patch
        run: |
          python scripts/apply-encoding-invariance-116.py
          python scripts/apply-encoding-followup-116.py
          python scripts/apply-encoding-exact-sql-116.py
          # Temporary scaffolding: normalize one accidental semicolon in generated fixture.
          sed -i 's/));$/))/g' etl/tests/test_encoding_invariance_116.py

      - name: Run focused regression tests
        working-directory: etl
        run: uv run pytest -q tests/test_encoding_invariance_116.py tests/test_transform.py tests/test_registry.py

      - name: Run full ETL test suite
        working-directory: etl
        run: uv run pytest -q tests

      - name: Run lint
        working-directory: etl
        run: |
          uv run ruff check src tests bench
          uv run ruff format --check src tests bench

      - name: Commit fix to PR head
        run: |
          git config user.name "ficha-etl-bot"
          git config user.email "ficha-etl-bot@users.noreply.github.com"
          git add \
            etl/src/ficha_etl/transform.py \
            etl/src/ficha_etl/registry.py \
            etl/tests/test_transform.py \
            etl/tests/test_registry.py \
            etl/tests/test_encoding_invariance_116.py
          git commit -m "fix(etl): transcode legacy CSVs before DuckDB (#116)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
