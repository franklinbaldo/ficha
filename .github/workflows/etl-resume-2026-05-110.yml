name: ETL — issue 110 resume 2026-05 (companies.zip + manifest)

# Retomada, não recomputação. O run 31450937194 deixou todos os artefatos
# derivados de 2026-05 duráveis em ia:ficha-2026-05 e morreu no timeout durante
# o upload de companies.zip. Este workflow refaz apenas o que falta:
#
#   sonda de throughput (gate #133) → download dos parquets do IA
#   → pack companies.zip → upload → build/verify/promote do manifest
#
# Nenhum gate de integridade é afrouxado: build_snapshot_entry() continua
# exigindo companies.zip e verify_snapshot_files() continua fazendo HEAD com
# conferência de tamanho em todas as URLs declaradas.

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: issue-110-resume-2026-05
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  MONTH: '2026-05'
  IA_BASE: https://archive.org/download/ficha-2026-05

jobs:
  resume:
    if: github.event.pull_request.head.ref == 'claude/ficha-restore-public-2026-05-q5u2bw'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ficha-restore-public-2026-05-q5u2bw

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --extra dev

      # Gate de #133: falhar em ~10 min se a taxa de upload do IA não permitir
      # concluir os 21,8 GiB de companies.zip, em vez de descobrir isso depois
      # de ~3h de pack — que foi exatamente o padrão do run anterior.
      - name: Probe IA upload throughput before spending hours on pack
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: uv run python .ops_probe_ia_throughput.py

      # Insumos do pack. São exatamente os arquivos que o run anterior já
      # tornou duráveis no IA — baixá-los custa minutos contra as ~5h30 de
      # download da RFB + transform que produziram esses mesmos bytes.
      - name: Download pack inputs from ia:ficha-2026-05
        run: |
          set -euo pipefail
          out=".cache/${MONTH}/output"
          mkdir -p "$out/lookups"
          for f in raizes.parquet cnpjs.parquet socios.parquet lookups.json; do
            echo "→ $f"
            curl -fsSL --retry 5 --retry-delay 10 -o "$out/$f" "$IA_BASE/$f"
          done
          for k in cnaes motivos municipios naturezas paises qualificacoes; do
            echo "→ lookups/$k.parquet"
            curl -fsSL --retry 5 --retry-delay 10 \
              -o "$out/lookups/$k.parquet" "$IA_BASE/lookups/$k.parquet"
          done
          ls -l "$out" "$out/lookups"
          df -h /

      - name: Pack companies.zip and upload to IA
        id: pack
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -o pipefail
          out=".cache/${MONTH}/output"
          uv run ficha-etl pack \
            --month "$MONTH" \
            --local-parquets "$out" \
            --output "$out/companies.zip" 2>&1 | tee pack.log
          ls -l "$out/companies.zip"
          df -h /

      # Só agora: build_snapshot_entry() precisa dos 9 artefatos locais para
      # calcular sha256/size/row_counts, e estes 4 não são insumo do pack.
      - name: Download remaining parquets for manifest hashing
        run: |
          set -euo pipefail
          out=".cache/${MONTH}/output"
          for f in cnpj_contatos.parquet cnpj_cnaes.parquet enderecos.parquet pessoas.parquet; do
            echo "→ $f"
            curl -fsSL --retry 5 --retry-delay 10 -o "$out/$f" "$IA_BASE/$f"
          done
          ls -l "$out"
          df -h /

      - name: Build, verify and promote manifest
        id: promote
        run: |
          set -o pipefail
          uv run python .ops_promote_manifest_2026_05.py 2>&1 | tee promote.log

      - name: Show promoted manifest
        if: always()
        run: |
          echo '--- web/public/manifest.json ---'
          python3 -c "
          import json
          m = json.load(open('../web/public/manifest.json'))
          print('current:', m['current'])
          for s in m['snapshots']:
              print(' ', s['date'], 'cnpjs.size=', s['files']['cnpjs']['size'])
          "

      - name: Upload manifest evidence
        if: steps.promote.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-promoted-2026-05
          path: web/public/manifest.json
          if-no-files-found: error

      - name: Commit promoted manifest
        if: steps.promote.outcome == 'success'
        run: |
          set -euo pipefail
          cd ..
          git add web/public/manifest.json
          if git diff --cached --quiet -- web/public/manifest.json; then
            echo '::error::promoção reportou sucesso mas o manifest não mudou'
            exit 1
          fi
          git config user.name ficha-etl-bot
          git config user.email ficha-etl-bot@users.noreply.github.com
          git commit -m 'chore(etl): publish verified snapshot 2026-05 (#110)'
          git push origin HEAD:claude/ficha-restore-public-2026-05-q5u2bw

      - name: Report result on issue 110
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PACK: ${{ steps.pack.outcome }}
          PROMOTE: ${{ steps.promote.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const tail = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(-6000); }
              catch { return '(sem log)'; }
            };
            const body = [
              '## ETL #110 — retomada de `2026-05` (companies.zip + manifest)',
              '',
              `**pack:** \`${process.env.PACK}\` · **promote:** \`${process.env.PROMOTE}\``,
              `[workflow run](${process.env.RUN_URL})`,
              '',
              '<details open><summary>promote.log</summary>', '',
              '```', tail('etl/promote.log'), '```', '', '</details>',
              '',
              '<details><summary>pack.log (tail)</summary>', '',
              '```', tail('etl/pack.log'), '```', '', '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 110,
              body,
            });

      - name: Propagate failure
        if: steps.promote.outcome != 'success'
        run: exit 1
